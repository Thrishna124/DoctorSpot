{%load static%}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title align='center'>Login</title>
    <link rel="stylesheet" type="text/css" href="{% static 'main_page_styles.css' %}">

</head>
<body>
    <h1 align='center'>Login</h1>
    <div class="form-container">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p> <a href="{% url 'main_page:register' %}"> New user </a></p>
</div>
</body>
{% if messages %}
    <ul>
        {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}
</html>
